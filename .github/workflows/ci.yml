# Compila e roda todos os testes a cada push e pull request; depois confere se a imagem
# Docker ainda e gerada. Nada e publicado.
name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Compilar e testar
        run: |
          chmod +x mvnw
          ./mvnw -B verify

      - name: Relatorios dos testes
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-dos-testes
          path: target/surefire-reports/
          retention-days: 7

  imagem-docker:
    needs: testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Gerar a imagem
        run: docker build -t clinica:ci .

      - name: Subir o container e esperar o health check
        run: |
          docker run -d --name clinica -p 8080:8080 clinica:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/actuator/health; then exit 0; fi
            sleep 3
          done
          docker logs clinica
          exit 1
