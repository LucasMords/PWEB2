# Compila e roda todos os testes contra um PostgreSQL de verdade a cada push e pull
# request; depois sobe a aplicacao com o Docker Compose (aplicacao + banco) e espera o
# health check. Nada e publicado.
name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: clinica_teste
          POSTGRES_USER: clinica
          POSTGRES_PASSWORD: senha-do-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clinica -d clinica_teste"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Sobrepoe o H2 dos testes (src/test/resources/config/application.properties).
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/clinica_teste
      SPRING_DATASOURCE_USERNAME: clinica
      SPRING_DATASOURCE_PASSWORD: senha-do-ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Compilar e testar
        run: |
          chmod +x mvnw
          ./mvnw -B verify

      - name: Relatorios dos testes
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-dos-testes
          path: target/surefire-reports/
          retention-days: 7

  imagem-docker:
    needs: testes
    runs-on: ubuntu-latest
    env:
      DB_SENHA: senha-do-ci
      CLINICA_SENHA_ADMIN: SenhaDoCi123
    steps:
      - uses: actions/checkout@v4

      - name: Subir aplicacao e banco
        run: docker compose up -d --build

      - name: Esperar o health check
        run: |
          for i in $(seq 1 40); do
            if curl -fsS http://localhost:8080/actuator/health; then exit 0; fi
            sleep 3
          done
          docker compose logs
          exit 1

      - name: Conferir o login do admin
        run: curl -fsS -u admin:SenhaDoCi123 http://localhost:8080/actuator/health | grep -q '"db"'

      - name: Derrubar
        if: always()
        run: docker compose down -v
