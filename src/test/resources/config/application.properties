# Testes: H2 em memoria no modo PostgreSQL, com as mesmas migracoes do Flyway (esquema e
# dados de demonstracao). Este arquivo fica em config/ para somar-se ao application.properties
# principal (e sobrepor so o que esta aqui), em vez de substitui-lo.
# Para rodar os testes contra um PostgreSQL de verdade (como no CI), basta definir
# SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME e SPRING_DATASOURCE_PASSWORD.
spring.datasource.url=jdbc:h2:mem:clinica;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.show-sql=false
