<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<!-- Usado pelo gerenciamento (/agendamentos/list, com filtros) e por "Meus agendamentos"
     (/usuario/agendamentos, sem filtros: o model não traz o objeto "filtro"). -->
<head th:replace="~{fragments/layout :: head(${titulo})}"></head>
<body>

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
        <h1 class="h3 mb-0" th:text="${titulo}">Agendamentos</h1>
        <div class="d-flex flex-wrap gap-2">
            <a class="btn btn-outline-primary" th:href="@{/agenda/dia}"
               sec:authorize="hasAnyRole('ADMIN','ATENDENTE','MEDICO')">Agenda do dia</a>
            <a class="btn btn-primary" th:href="@{/agenda/list}" sec:authorize="hasRole('ATENDENTE')">Novo agendamento</a>
        </div>
    </div>

    <div th:replace="~{fragments/layout :: mensagem}"></div>
    <div th:replace="~{fragments/layout :: erro}"></div>

    <p class="text-secondary small" sec:authorize="hasRole('PACIENTE') and !hasAnyRole('ADMIN','ATENDENTE','MEDICO')">
        Para marcar, remarcar ou cancelar uma consulta, entre em contato com o atendimento da clínica.
    </p>

    <form class="card card-body border-0 shadow-sm mb-3" method="get" th:if="${filtro != null}"
          th:action="@{/agendamentos/list}" th:object="${filtro}">
        <div class="row g-3 align-items-end">
            <div class="col-md-3">
                <label class="form-label" for="pacienteId">Paciente</label>
                <select class="form-select" th:field="*{pacienteId}">
                    <option value="">Todos</option>
                    <option th:each="paciente : ${pacientes}" th:value="${paciente.id}" th:text="${paciente.nome}"></option>
                </select>
            </div>
            <div class="col-md-3">
                <label class="form-label" for="medicoId">Médico</label>
                <select class="form-select" th:field="*{medicoId}">
                    <option value="">Todos</option>
                    <option th:each="medico : ${medicos}" th:value="${medico.id}" th:text="${medico.nome}"></option>
                </select>
            </div>
            <div class="col-md-2">
                <label class="form-label" for="data">Data</label>
                <input type="date" class="form-control" th:field="*{data}">
            </div>
            <div class="col-md-2">
                <label class="form-label" for="status">Situação</label>
                <select class="form-select" th:field="*{status}">
                    <option value="">Todas</option>
                    <option th:each="situacao : ${statusDisponiveis}"
                            th:value="${situacao}" th:text="${situacao.descricao}"></option>
                </select>
            </div>
            <div class="col-md-2 d-flex gap-2">
                <button type="submit" class="btn btn-primary flex-fill">Filtrar</button>
                <a class="btn btn-outline-secondary" th:href="@{/agendamentos/list}">Limpar</a>
            </div>
        </div>
    </form>

    <div class="alert alert-light border" th:if="${pagina.empty}">
        Nenhum agendamento encontrado.
    </div>

    <div class="card border-0 shadow-sm" th:unless="${pagina.empty}">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead>
                <tr>
                    <th>Data</th>
                    <th>Horário</th>
                    <th>Paciente</th>
                    <th>Médico</th>
                    <th>Situação</th>
                    <th sec:authorize="hasRole('ATENDENTE')">Ações</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="agendamento : ${pagina.content}"
                    th:with="descricao=|${agendamento.paciente.nome} com ${agendamento.agenda.medico.nome}, em ${#temporals.format(agendamento.agenda.data, 'dd/MM/yyyy')} às ${#temporals.format(agendamento.agenda.horario, 'HH:mm')}|">
                    <td th:text="${#temporals.format(agendamento.agenda.data, 'dd/MM/yyyy')}"></td>
                    <td th:text="${#temporals.format(agendamento.agenda.horario, 'HH:mm')}"></td>
                    <td th:text="${agendamento.paciente.nome}"></td>
                    <td th:text="${agendamento.agenda.medico.nome}"></td>
                    <td><div th:replace="~{fragments/agendamento :: situacao(${agendamento})}"></div></td>
                    <td sec:authorize="hasRole('ATENDENTE')"><div th:replace="~{fragments/agendamento :: acoes(${agendamento}, ${descricao})}"></div></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <nav class="mt-3" aria-label="Páginas de agendamentos" th:if="${pagina.totalPages > 1}">
        <ul class="pagination justify-content-center mb-0">
            <li class="page-item" th:classappend="${pagina.first} ? 'disabled'">
                <a class="page-link"
                   th:href="@{${urlLista}(page=${pagina.number - 1}, pacienteId=${filtro?.pacienteId}, medicoId=${filtro?.medicoId}, data=${filtro?.data}, status=${filtro?.status})}">Anterior</a>
            </li>
            <li class="page-item disabled">
                <span class="page-link" th:text="|Página ${pagina.number + 1} de ${pagina.totalPages}|"></span>
            </li>
            <li class="page-item" th:classappend="${pagina.last} ? 'disabled'">
                <a class="page-link"
                   th:href="@{${urlLista}(page=${pagina.number + 1}, pacienteId=${filtro?.pacienteId}, medicoId=${filtro?.medicoId}, data=${filtro?.data}, status=${filtro?.status})}">Próxima</a>
            </li>
        </ul>
    </nav>
</main>

<th:block th:replace="~{fragments/agendamento :: modais(null, null)}"></th:block>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>

</body>
</html>
