<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Confirmar agendamento')}"></head>
<body>

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container">
    <div class="row">
        <div class="col-lg-8">
            <h1 class="h3 mb-1">Confirmar agendamento</h1>
            <p class="text-secondary">Confira os dados antes de concluir. O horário só é reservado após a confirmação.</p>

            <!-- novalidate: o navegador não valida nada; quem valida é o back-end -->
            <form class="card card-body border-0 shadow-sm"
                  th:action="@{/agendamentos/save}"
                  th:object="${form}"
                  method="post"
                  novalidate>
                <input type="hidden" th:field="*{agendaId}">

                <div th:replace="~{fragments/layout :: erros}"></div>

                <dl class="row mb-2">
                    <dt class="col-sm-3">Médico</dt>
                    <dd class="col-sm-9" th:text="${agenda.medico.nome}"></dd>

                    <dt class="col-sm-3">Especialidade</dt>
                    <dd class="col-sm-9" th:text="${agenda.medico.especialidade}"></dd>

                    <dt class="col-sm-3">Data</dt>
                    <dd class="col-sm-9" th:text="${#temporals.format(agenda.data, 'dd/MM/yyyy')}"></dd>

                    <dt class="col-sm-3">Horário</dt>
                    <dd class="col-sm-9" th:text="${#temporals.format(agenda.horario, 'HH:mm')}"></dd>
                </dl>

                <!-- O atendente escolhe para qual paciente é o agendamento -->
                <div class="mb-3">
                    <label class="form-label" for="pacienteId">Paciente</label>
                    <select class="form-select" th:field="*{pacienteId}" th:errorclass="is-invalid">
                        <option value="">Selecione</option>
                        <option th:each="paciente : ${pacientes}"
                                th:value="${paciente.id}"
                                th:text="${paciente.nome + ' - ' + paciente.cpf}">
                        </option>
                    </select>
                    <div class="invalid-feedback" th:errors="*{pacienteId}"></div>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary">Confirmar agendamento</button>
                    <a class="btn btn-outline-secondary" th:href="@{/agenda/list}">Voltar</a>
                </div>
            </form>
        </div>
    </div>
</main>

</body>
</html>
