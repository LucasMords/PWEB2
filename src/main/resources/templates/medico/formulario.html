<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Médico</title>
    <link rel="stylesheet" th:href="@{/css/estilo.css}">
</head>
<body>

<header>
    <strong>Clínica IFTO</strong>
    <nav>
        <a th:href="@{/medicos/list}">Voltar</a>
    </nav>
</header>

<main>
    <h1 th:text="${medico.id == null ? 'Novo médico' : 'Editar médico'}"></h1>

    <form class="cartao"
          th:action="${medico.id == null} ? @{/medicos/save} : @{/medicos/update}"
          th:object="${medico}"
          method="post">
        <input type="hidden" th:field="*{id}">

        <label>Nome</label>
        <input type="text" th:field="*{nome}" maxlength="120" required>

        <label>CRM</label>
        <input type="text" th:field="*{crm}" maxlength="20" required>

        <label>Especialidade</label>
        <input type="text" th:field="*{especialidade}" maxlength="80" required>

        <label>Telefone</label>
        <input type="text" th:field="*{telefone}" maxlength="20">

        <label>E-mail</label>
        <input type="email" th:field="*{email}" maxlength="120">

        <button type="submit">Salvar</button>
    </form>
</main>

</body>
</html>
