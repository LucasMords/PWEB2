<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Médicos')}"></head>
<body>

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
        <h1 class="h3 mb-0">Médicos</h1>
        <!-- Esconder o botão é só comodidade: quem protege a URL é a SecurityConfiguration. -->
        <a class="btn btn-primary" th:href="@{/medicos/form}" sec:authorize="hasRole('ADMIN')">Novo médico</a>
    </div>

    <div th:replace="~{fragments/layout :: mensagem}"></div>
    <div th:replace="~{fragments/layout :: erro}"></div>

    <div class="card border-0 shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead>
                <tr>
                    <th>Nome</th>
                    <th>CRM</th>
                    <th>Especialidade</th>
                    <th>Telefone</th>
                    <th>Ações</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="medico : ${medicos}">
                    <td th:text="${medico.nome}"></td>
                    <td th:text="${medico.crm}"></td>
                    <td th:text="${medico.especialidade}"></td>
                    <td th:text="${medico.telefone}"></td>
                    <td>
                        <div class="d-flex gap-2">
                            <a class="btn btn-sm btn-primary"
                               th:href="@{/medicos/consultas/{id}(id=${medico.id})}">Consultas</a>
                            <a class="btn btn-sm btn-outline-secondary" sec:authorize="hasRole('ADMIN')"
                               th:href="@{/medicos/edit/{id}(id=${medico.id})}">Editar</a>
                            <!-- Exclusão por POST: o th:action inclui o token CSRF -->
                            <form class="m-0" method="post" sec:authorize="hasRole('ADMIN')"
                                  th:action="@{/medicos/remove/{id}(id=${medico.id})}"
                                  onsubmit="return confirm('Excluir este médico?')">
                                <button type="submit" class="btn btn-sm btn-outline-danger">Excluir</button>
                            </form>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

</body>
</html>
