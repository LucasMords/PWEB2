<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Meus dados')}"></head>
<body>

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container">
    <h1 class="h3 mb-3">Meus dados</h1>

    <div th:replace="~{fragments/layout :: mensagem}"></div>

    <div class="card border-0 shadow-sm">
        <div class="card-body">
            <dl class="row mb-0">
                <dt class="col-sm-3">Login</dt>
                <dd class="col-sm-9" th:text="${usuario.login}"></dd>

                <!-- A pessoa a quem a conta pertence; admin e recepção não têm vínculo. -->
                <th:block th:if="${paciente != null}">
                    <dt class="col-sm-3">Paciente</dt>
                    <dd class="col-sm-9" th:text="${paciente.nome}"></dd>
                </th:block>
                <th:block th:if="${medico != null}">
                    <dt class="col-sm-3">Médico</dt>
                    <dd class="col-sm-9" th:text="|${medico.nome} (${medico.crm})|"></dd>
                </th:block>

                <dt class="col-sm-3">Situação</dt>
                <dd class="col-sm-9" th:text="${usuario.ativo} ? 'Ativo' : 'Inativo'"></dd>

                <dt class="col-sm-3">Perfis</dt>
                <dd class="col-sm-9 mb-0">
                    <span class="badge text-bg-secondary me-1" th:each="perfil : ${usuario.perfis}"
                          th:text="${perfil.nome}"></span>
                </dd>
            </dl>
            <a class="btn btn-outline-primary mt-3" th:href="@{/usuario/senha}">Trocar senha</a>
        </div>
    </div>

    <!-- LGPD: direitos do titular. Só para contas de paciente. -->
    <section class="card border-0 shadow-sm mt-3" th:if="${paciente != null}">
        <div class="card-body">
            <h2 class="h6">Seus dados e a LGPD</h2>
            <p class="mb-2">
                Você pode baixar uma cópia de tudo o que a clínica guarda sobre você: cadastro,
                agendamentos e consultas.
                <th:block th:if="${paciente.consentimentoEm != null}">
                    Você aceitou a política de privacidade em
                    <span th:text="${#temporals.format(paciente.consentimentoEm, 'dd/MM/yyyy HH:mm')}"></span>.
                </th:block>
            </p>
            <div class="d-flex flex-wrap gap-2">
                <a class="btn btn-outline-primary" th:href="@{/usuario/dados/exportar}">Baixar meus dados (JSON)</a>
                <a class="btn btn-outline-secondary" th:href="@{/privacidade}">Política de privacidade</a>
            </div>
        </div>
    </section>
</main>

</body>
</html>
