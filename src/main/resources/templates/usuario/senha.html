<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Trocar senha')}"></head>
<body>

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container">
    <div class="row">
        <div class="col-lg-6">
            <h1 class="h3 mb-3">Trocar senha</h1>

            <div class="alert alert-warning" role="alert" th:if="${provisoria}">
                Sua senha é provisória. Escolha uma nova para continuar usando o sistema.
            </div>

            <!-- novalidate: o navegador não valida nada; quem valida é o back-end -->
            <form class="card card-body border-0 shadow-sm"
                  th:action="@{/usuario/senha}"
                  th:object="${form}"
                  method="post"
                  novalidate>

                <div th:replace="~{fragments/layout :: erros}"></div>

                <!-- type=password com th:field nunca volta preenchido -->
                <div class="mb-3">
                    <label class="form-label" for="senhaAtual">Senha atual</label>
                    <input type="password" class="form-control" th:field="*{senhaAtual}" th:errorclass="is-invalid"
                           autocomplete="current-password">
                    <div class="invalid-feedback" th:errors="*{senhaAtual}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label" for="novaSenha">Nova senha</label>
                    <input type="password" class="form-control" th:field="*{novaSenha}" th:errorclass="is-invalid"
                           autocomplete="new-password">
                    <div class="invalid-feedback" th:errors="*{novaSenha}"></div>
                    <div class="form-text">Mínimo de 8 caracteres, com letras e números, sem conter o usuário.</div>
                </div>

                <div class="mb-3">
                    <label class="form-label" for="confirmacao">Repita a nova senha</label>
                    <input type="password" class="form-control" th:field="*{confirmacao}" th:errorclass="is-invalid"
                           autocomplete="new-password">
                    <div class="invalid-feedback" th:errors="*{confirmacao}"></div>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary">Trocar senha</button>
                    <a class="btn btn-outline-secondary" th:href="@{/usuario/dados}" th:unless="${provisoria}">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</main>

</body>
</html>
