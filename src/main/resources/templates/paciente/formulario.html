<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Paciente')}"></head>
<body>

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container">
    <div class="row">
        <div class="col-lg-8">
            <h1 class="h3 mb-3" th:text="${paciente.id == null ? 'Novo paciente' : 'Editar paciente'}"></h1>

            <!-- novalidate: o navegador não valida nada; quem valida é o back-end -->
            <form class="card card-body border-0 shadow-sm"
                  th:action="${paciente.id == null} ? @{/pacientes/save} : @{/pacientes/update}"
                  th:object="${paciente}"
                  method="post"
                  novalidate>
                <input type="hidden" th:field="*{id}">

                <div th:replace="~{fragments/layout :: erros}"></div>

                <div class="mb-3">
                    <label class="form-label" for="nome">Nome</label>
                    <input type="text" class="form-control" th:field="*{nome}" th:errorclass="is-invalid">
                    <div class="invalid-feedback" th:errors="*{nome}"></div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label" for="cpf">CPF</label>
                        <input type="text" class="form-control" th:field="*{cpf}" th:errorclass="is-invalid"
                               data-mascara="cpf" inputmode="numeric" placeholder="000.000.000-00">
                        <div class="invalid-feedback" th:errors="*{cpf}"></div>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label" for="dataNascimento">Data de nascimento</label>
                        <input type="date" class="form-control" th:field="*{dataNascimento}" th:errorclass="is-invalid">
                        <div class="invalid-feedback" th:errors="*{dataNascimento}"></div>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label" for="telefone">Telefone</label>
                        <input type="text" class="form-control" th:field="*{telefone}" th:errorclass="is-invalid">
                        <div class="invalid-feedback" th:errors="*{telefone}"></div>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label" for="email">E-mail</label>
                        <input type="text" class="form-control" th:field="*{email}" th:errorclass="is-invalid">
                        <div class="invalid-feedback" th:errors="*{email}"></div>
                    </div>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary">Salvar</button>
                    <a class="btn btn-outline-secondary" th:href="@{/pacientes/list}">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</main>

<script th:src="@{/js/mascaras.js}"></script>

</body>
</html>
