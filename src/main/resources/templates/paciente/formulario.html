<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Paciente')}"></head>
<body>

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container">
    <div class="row">
        <div class="col-lg-8">
            <h1 class="h3 mb-3" th:text="${paciente.id == null ? 'Novo paciente' : 'Editar paciente'}"></h1>

            <!-- novalidate: o navegador não valida nada; quem valida é o back-end -->
            <form class="card card-body border-0 shadow-sm"
                  th:action="${paciente.id == null} ? @{/pacientes/save} : @{/pacientes/update}"
                  th:object="${paciente}"
                  method="post"
                  novalidate>
                <input type="hidden" th:field="*{id}">

                <div th:replace="~{fragments/layout :: erros}"></div>

                <div class="mb-3">
                    <label class="form-label" for="nome">Nome</label>
                    <input type="text" class="form-control" th:field="*{nome}" th:errorclass="is-invalid">
                    <div class="invalid-feedback" th:errors="*{nome}"></div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label" for="cpf">CPF</label>
                        <input type="text" class="form-control" th:field="*{cpf}" th:errorclass="is-invalid"
                               data-mascara="cpf" inputmode="numeric" placeholder="000.000.000-00">
                        <div class="invalid-feedback" th:errors="*{cpf}"></div>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label" for="dataNascimento">Data de nascimento</label>
                        <input type="date" class="form-control" th:field="*{dataNascimento}" th:errorclass="is-invalid">
                        <div class="invalid-feedback" th:errors="*{dataNascimento}"></div>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label" for="telefone">Telefone</label>
                        <input type="text" class="form-control" th:field="*{telefone}" th:errorclass="is-invalid">
                        <div class="invalid-feedback" th:errors="*{telefone}"></div>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label" for="email">E-mail</label>
                        <input type="text" class="form-control" th:field="*{email}" th:errorclass="is-invalid">
                        <div class="invalid-feedback" th:errors="*{email}"></div>
                    </div>
                </div>

                <!-- A conta de acesso é criada junto com o paciente; na edição ela não é alterada. -->
                <th:block th:if="${paciente.id == null}">
                    <fieldset th:replace="~{fragments/layout :: credenciais}"></fieldset>

                    <!-- LGPD: aceite obrigatório da política de privacidade. Na recepção, o
                         funcionário marca depois de o paciente concordar. -->
                    <div class="form-check mb-3">
                        <input class="form-check-input" type="checkbox" id="consentimento" name="consentimento" value="true"
                               th:classappend="${erroConsentimento != null} ? 'is-invalid'"
                               th:checked="${param.consentimento != null}">
                        <label class="form-check-label" for="consentimento">
                            Li e concordo com a <a th:href="@{/privacidade}" target="_blank" rel="noopener">política de privacidade</a>,
                            inclusive com o uso dos meus dados de saúde para o atendimento na clínica.
                        </label>
                        <div class="invalid-feedback" th:text="${erroConsentimento}"></div>
                    </div>
                </th:block>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary">Salvar</button>
                    <!-- A lista é da equipe; quem está se cadastrando sozinho volta para o login. -->
                    <a class="btn btn-outline-secondary" th:href="@{/pacientes/list}"
                       sec:authorize="hasAnyRole('ADMIN','ATENDENTE','MEDICO')">Cancelar</a>
                    <a class="btn btn-outline-secondary" th:href="@{/login}"
                       sec:authorize="!isAuthenticated()">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</main>

<script th:src="@{/js/mascaras.js}"></script>

</body>
</html>
