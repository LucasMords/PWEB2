<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paciente</title>
    <link rel="stylesheet" th:href="@{/css/estilo.css}">
</head>
<body>

<header>
    <strong>Clínica IFTO</strong>
    <nav>
        <a th:href="@{/pacientes/list}">Voltar</a>
    </nav>
</header>

<main>
    <h1 th:text="${paciente.id == null ? 'Novo paciente' : 'Editar paciente'}"></h1>

    <form class="cartao"
          th:action="${paciente.id == null} ? @{/pacientes/save} : @{/pacientes/update}"
          th:object="${paciente}"
          method="post">
        <input type="hidden" th:field="*{id}">

        <label>Nome</label>
        <input type="text" th:field="*{nome}" maxlength="120" required>

        <label>CPF</label>
        <input type="text" th:field="*{cpf}" maxlength="14" required>

        <label>Data de nascimento</label>
        <input type="date" th:field="*{dataNascimento}" required>

        <label>Telefone</label>
        <input type="text" th:field="*{telefone}" maxlength="20">

        <label>E-mail</label>
        <input type="email" th:field="*{email}" maxlength="120">

        <button type="submit">Salvar</button>
    </form>
</main>

</body>
</html>
