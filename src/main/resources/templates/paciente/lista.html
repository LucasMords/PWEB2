<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Pacientes')}"></head>
<body>

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
        <h1 class="h3 mb-0">Pacientes</h1>
        <a class="btn btn-primary" th:href="@{/pacientes/form}">Novo paciente</a>
    </div>

    <div th:replace="~{fragments/layout :: mensagem}"></div>
    <div th:replace="~{fragments/layout :: erro}"></div>

    <form class="card card-body border-0 shadow-sm mb-3" method="get" th:action="@{/pacientes/list}" role="search">
        <div class="row g-2 align-items-end">
            <div class="col-md-6">
                <label class="form-label" for="busca">Buscar por nome ou CPF</label>
                <input type="search" class="form-control" id="busca" name="busca" maxlength="100"
                       th:value="${busca}" placeholder="Ex.: Ana ou 123.456">
            </div>
            <div class="col-auto">
                <button type="submit" class="btn btn-primary">Buscar</button>
            </div>
            <div class="col-auto" th:if="${!#strings.isEmpty(busca)}">
                <a class="btn btn-outline-secondary" th:href="@{/pacientes/list}">Limpar</a>
            </div>
        </div>
    </form>

    <div class="alert alert-light border" th:if="${pagina.empty}">
        Nenhum paciente encontrado.
    </div>

    <div class="card border-0 shadow-sm" th:unless="${pagina.empty}">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead>
                <tr>
                    <th>Nome</th>
                    <th>CPF</th>
                    <th>Nascimento</th>
                    <th>Telefone</th>
                    <th>Ações</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="paciente : ${pagina.content}">
                    <td th:text="${paciente.nome}"></td>
                    <td th:text="${paciente.cpf}"></td>
                    <td th:text="${#temporals.format(paciente.dataNascimento, 'dd/MM/yyyy')}"></td>
                    <td th:text="${paciente.telefone}"></td>
                    <td>
                        <div class="d-flex gap-2">
                            <a class="btn btn-sm btn-primary"
                               th:href="@{/pacientes/consultas/{id}(id=${paciente.id})}">Consultas</a>
                            <a class="btn btn-sm btn-outline-secondary"
                               th:href="@{/pacientes/edit/{id}(id=${paciente.id})}">Editar</a>
                            <!-- Exclusão por POST: o th:action inclui o token CSRF -->
                            <form class="m-0" method="post" sec:authorize="hasRole('ADMIN')"
                                  th:action="@{/pacientes/remove/{id}(id=${paciente.id})}"
                                  data-confirmar="Excluir este paciente?">
                                <button type="submit" class="btn btn-sm btn-outline-danger">Excluir</button>
                            </form>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <nav class="mt-3" aria-label="Páginas de pacientes" th:if="${pagina.totalPages > 1}">
        <ul class="pagination justify-content-center mb-0">
            <li class="page-item" th:classappend="${pagina.first} ? 'disabled'">
                <a class="page-link" th:href="@{/pacientes/list(page=${pagina.number - 1}, busca=${busca})}">Anterior</a>
            </li>
            <li class="page-item disabled">
                <span class="page-link" th:text="|Página ${pagina.number + 1} de ${pagina.totalPages}|"></span>
            </li>
            <li class="page-item" th:classappend="${pagina.last} ? 'disabled'">
                <a class="page-link" th:href="@{/pacientes/list(page=${pagina.number + 1}, busca=${busca})}">Próxima</a>
            </li>
        </ul>
    </nav>
</main>

<script th:src="@{/js/confirmar.js}"></script>

</body>
</html>
