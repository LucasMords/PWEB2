<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Pacientes')}"></head>
<body>

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
        <h1 class="h3 mb-0">Pacientes</h1>
        <a class="btn btn-primary" th:href="@{/pacientes/form}">Novo paciente</a>
    </div>

    <div th:replace="~{fragments/layout :: mensagem}"></div>

    <div class="card border-0 shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead>
                <tr>
                    <th>Nome</th>
                    <th>CPF</th>
                    <th>Nascimento</th>
                    <th>Telefone</th>
                    <th>Ações</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="paciente : ${pacientes}">
                    <td th:text="${paciente.nome}"></td>
                    <td th:text="${paciente.cpf}"></td>
                    <td th:text="${#temporals.format(paciente.dataNascimento, 'dd/MM/yyyy')}"></td>
                    <td th:text="${paciente.telefone}"></td>
                    <td>
                        <div class="d-flex gap-2">
                            <a class="btn btn-sm btn-primary"
                               th:href="@{/pacientes/consultas/{id}(id=${paciente.id})}">Consultas</a>
                            <a class="btn btn-sm btn-outline-secondary"
                               th:href="@{/pacientes/edit/{id}(id=${paciente.id})}">Editar</a>
                            <a class="btn btn-sm btn-outline-danger"
                               th:href="@{/pacientes/remove/{id}(id=${paciente.id})}"
                               onclick="return confirm('Excluir este paciente e suas consultas?')">Excluir</a>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

</body>
</html>
