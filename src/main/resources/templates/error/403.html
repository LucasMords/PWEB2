<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<!-- O Spring Boot usa este template automaticamente para respostas 403:
     usuário autenticado, mas sem o perfil exigido pela regra de autorização. -->
<head th:replace="~{fragments/layout :: head('Acesso negado')}"></head>
<body>

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container">
    <div class="card border-0 shadow-sm">
        <div class="card-body text-center py-5">
            <h1 class="display-6">Acesso negado</h1>
            <p class="text-secondary mb-4">Seu perfil não tem permissão para acessar esta página.</p>
            <a class="btn btn-primary" th:href="@{/}">Voltar ao início</a>
        </div>
    </div>
</main>

</body>
</html>
