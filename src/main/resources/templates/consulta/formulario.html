<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Consulta')}"></head>
<body>

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container">
    <div class="row">
        <div class="col-lg-8">
            <h1 class="h3 mb-3">Observações da consulta</h1>

            <!-- novalidate: o navegador não valida nada; quem valida é o back-end -->
            <form class="card card-body border-0 shadow-sm"
                  th:action="@{/consultas/update}"
                  th:object="${form}"
                  method="post"
                  novalidate>
                <input type="hidden" th:field="*{id}">

                <div th:replace="~{fragments/layout :: erros}"></div>

                <!-- Dados vindos do agendamento: não são editáveis -->
                <dl class="row mb-2">
                    <dt class="col-sm-3">Paciente</dt>
                    <dd class="col-sm-9" th:text="${consulta.paciente.nome}"></dd>

                    <dt class="col-sm-3">Médico</dt>
                    <dd class="col-sm-9" th:text="${consulta.medico.nome}"></dd>

                    <dt class="col-sm-3">Realizada em</dt>
                    <dd class="col-sm-9" th:text="${#temporals.format(consulta.dataRealizacao, 'dd/MM/yyyy HH:mm')}"></dd>

                    <dt class="col-sm-3">Agendamento</dt>
                    <dd class="col-sm-9"
                        th:text="|Nº ${consulta.agendamento.id}, marcado para ${#temporals.format(consulta.agendamento.agenda.dataHora, 'dd/MM/yyyy HH:mm')}|"></dd>
                </dl>

                <div class="mb-3">
                    <label class="form-label" for="observacoes">Observações</label>
                    <textarea class="form-control" rows="4" th:field="*{observacoes}" th:errorclass="is-invalid"></textarea>
                    <div class="invalid-feedback" th:errors="*{observacoes}"></div>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary">Salvar</button>
                    <a class="btn btn-outline-secondary" th:href="@{/consultas/list}">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</main>

</body>
</html>
