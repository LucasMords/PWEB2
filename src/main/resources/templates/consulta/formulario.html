<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta</title>
    <link rel="stylesheet" th:href="@{/css/estilo.css}">
</head>
<body>

<header>
    <strong>Clínica IFTO</strong>
    <nav>
        <a th:href="@{/consultas/list}">Voltar</a>
    </nav>
</header>

<main>
    <h1 th:text="${consulta.id == null ? 'Nova consulta' : 'Editar consulta'}"></h1>

    <form class="cartao"
          th:action="${consulta.id == null} ? @{/consultas/save} : @{/consultas/update}"
          th:object="${consulta}"
          method="post">
        <div class="erros" role="alert" th:if="${#fields.hasAnyErrors()}">
            <p>Corrija os dados abaixo:</p>
            <ul><li th:each="erro : ${#fields.detailedErrors()}" th:text="${erro.message}"></li></ul>
        </div>
        <input type="hidden" th:field="*{id}" th:errorclass="is-invalid">

        <small class="erro" th:if="${#fields.hasErrors('id')}" th:errors="*{id}"></small>

        <label>Paciente</label>
        <select th:field="*{paciente.id}" th:errorclass="is-invalid" required>
            <option value="">Selecione</option>
            <option th:each="paciente : ${pacientes}"
                    th:value="${paciente.id}"
                    th:text="${paciente.nome}">
            </option>
        </select>

        <small class="erro" th:if="${#fields.hasErrors('paciente.id')}" th:errors="*{paciente.id}"></small>

        <label>Médico</label>
        <select th:field="*{medico.id}" th:errorclass="is-invalid" required>
            <option value="">Selecione</option>
            <option th:each="medico : ${medicos}"
                    th:value="${medico.id}"
                    th:text="${medico.nome + ' - ' + medico.especialidade}">
            </option>
        </select>

        <small class="erro" th:if="${#fields.hasErrors('medico.id')}" th:errors="*{medico.id}"></small>

        <label>Data e hora</label>
        <input type="datetime-local" th:field="*{dataHora}" th:errorclass="is-invalid" required>
        <small class="erro" th:if="${#fields.hasErrors('dataHora')}" th:errors="*{dataHora}"></small>

        <label>Status</label>
        <select th:field="*{status}" th:errorclass="is-invalid" required>
            <option th:each="situacao : ${statusDisponiveis}"
                    th:value="${situacao}"
                    th:text="${situacao.descricao}">
            </option>
        </select>

        <small class="erro" th:if="${#fields.hasErrors('status')}" th:errors="*{status}"></small>

        <label>Observações</label>
        <textarea th:field="*{observacoes}" th:errorclass="is-invalid" maxlength="500"></textarea>
        <small class="erro" th:if="${#fields.hasErrors('observacoes')}" th:errors="*{observacoes}"></small>

        <button type="submit">Salvar</button>
    </form>
</main>

</body>
</html>
