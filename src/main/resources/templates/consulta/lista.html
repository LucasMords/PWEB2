<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Consultas')}"></head>
<body>

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
        <h1 class="h3 mb-0" th:text="${titulo}">Consultas</h1>
        <!-- A consulta nasce da confirmação de presença, feita na tela de agendamentos. -->
        <a class="btn btn-outline-secondary" th:href="@{/agendamentos/list}"
           sec:authorize="hasAnyRole('ADMIN','ATENDENTE','MEDICO')">Ver agendamentos</a>
    </div>

    <div th:replace="~{fragments/layout :: mensagem}"></div>
    <div th:replace="~{fragments/layout :: erro}"></div>

    <div class="alert alert-light border" th:if="${#lists.isEmpty(consultas)}">
        Nenhuma consulta encontrada.
    </div>

    <div class="card border-0 shadow-sm" th:unless="${#lists.isEmpty(consultas)}">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead>
                <tr>
                    <th>Realizada em</th>
                    <th>Paciente</th>
                    <th>Médico</th>
                    <th>Agendamento</th>
                    <th>Observações</th>
                    <th th:if="${medicoDaConta != null}">Ações</th>
                </tr>
                </thead>
                <tbody>
                <!-- Observações são dado de saúde: só o paciente e o médico que atendeu leem. -->
                <tr th:each="consulta : ${consultas}"
                    th:with="doMedico=${medicoDaConta != null and consulta.medico.id == medicoDaConta}">
                    <td th:text="${#temporals.format(consulta.dataRealizacao, 'dd/MM/yyyy HH:mm')}"></td>
                    <td th:text="${consulta.paciente.nome}"></td>
                    <td th:text="${consulta.medico.nome}"></td>
                    <td>
                        <span th:text="|Nº ${consulta.agendamento.id}|"></span>
                        <span class="text-secondary small d-block"
                              th:text="|Horário marcado: ${#temporals.format(consulta.agendamento.agenda.dataHora, 'dd/MM/yyyy HH:mm')}|"></span>
                    </td>
                    <td>
                        <span th:if="${consultasProprias} or ${doMedico}" th:text="${consulta.observacoes}"></span>
                        <span class="text-secondary small" th:unless="${consultasProprias} or ${doMedico}">Restritas ao médico</span>
                    </td>
                    <td th:if="${medicoDaConta != null}">
                        <a class="btn btn-sm btn-outline-secondary" th:if="${doMedico}"
                           th:href="@{/consultas/edit/{id}(id=${consulta.id})}">Observações</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

</body>
</html>
