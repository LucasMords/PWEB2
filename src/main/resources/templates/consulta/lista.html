<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Consultas')}"></head>
<body>

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
        <h1 class="h3 mb-0" th:text="${titulo}">Consultas</h1>
        <a class="btn btn-primary" th:href="@{/consultas/form}">Nova consulta</a>
    </div>

    <div th:replace="~{fragments/layout :: mensagem}"></div>

    <div class="alert alert-light border" th:if="${#lists.isEmpty(consultas)}">
        Nenhuma consulta encontrada.
    </div>

    <div class="card border-0 shadow-sm" th:unless="${#lists.isEmpty(consultas)}">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead>
                <tr>
                    <th>Data e hora</th>
                    <th>Paciente</th>
                    <th>Médico</th>
                    <th>Status</th>
                    <th>Observações</th>
                    <th>Ações</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="consulta : ${consultas}">
                    <td th:text="${#temporals.format(consulta.dataHora, 'dd/MM/yyyy HH:mm')}"></td>
                    <td th:text="${consulta.paciente.nome}"></td>
                    <td th:text="${consulta.medico.nome}"></td>
                    <td>
                        <span class="badge"
                              th:classappend="${consulta.status.name() == 'REALIZADA'} ? 'text-bg-success'
                                            : (${consulta.status.name() == 'CANCELADA'} ? 'text-bg-danger' : 'text-bg-secondary')"
                              th:text="${consulta.status.descricao}"></span>
                    </td>
                    <td th:text="${consulta.observacoes}"></td>
                    <td>
                        <div class="d-flex gap-2">
                            <a class="btn btn-sm btn-outline-secondary"
                               th:href="@{/consultas/edit/{id}(id=${consulta.id})}">Editar</a>
                            <a class="btn btn-sm btn-outline-danger"
                               th:href="@{/consultas/remove/{id}(id=${consulta.id})}"
                               onclick="return confirm('Excluir esta consulta?')">Excluir</a>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

</body>
</html>
