<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Agenda do dia')}"></head>
<body>

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container" th:with="data=${agendaDoDia.data}, resumo=${agendaDoDia.resumo}">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
        <div>
            <h1 class="h3 mb-0">Agenda do dia</h1>
            <p class="text-secondary mb-0">
                <span th:text="${dataPorExtenso}">segunda-feira, 01/01/2030</span>
                <span class="badge text-bg-primary ms-1" th:if="${data == hoje}">Hoje</span>
            </p>
        </div>
        <div class="d-flex flex-wrap gap-2">
            <a class="btn btn-outline-secondary" th:href="@{/agenda/dia(data=${data.minusDays(1)}, medicoId=${medicoId})}">&larr; Anterior</a>
            <a class="btn btn-outline-secondary" th:href="@{/agenda/dia(medicoId=${medicoId})}">Hoje</a>
            <a class="btn btn-outline-secondary" th:href="@{/agenda/dia(data=${data.plusDays(1)}, medicoId=${medicoId})}">Próximo &rarr;</a>
        </div>
    </div>

    <div th:replace="~{fragments/layout :: mensagem}"></div>
    <div th:replace="~{fragments/layout :: erro}"></div>

    <form class="card card-body border-0 shadow-sm mb-3" method="get" th:action="@{/agenda/dia}">
        <div class="row g-3 align-items-end">
            <div class="col-md-3">
                <label class="form-label" for="data">Data</label>
                <input type="date" class="form-control" id="data" name="data" th:value="${data}">
            </div>
            <div class="col-md-4" th:if="${medicos != null}">
                <label class="form-label" for="medicoId">Médico</label>
                <select class="form-select" id="medicoId" name="medicoId">
                    <option value="">Todos</option>
                    <option th:each="medico : ${medicos}" th:value="${medico.id}" th:text="${medico.nome}"
                            th:selected="${medico.id == medicoId}"></option>
                </select>
            </div>
            <div class="col-md-2">
                <button type="submit" class="btn btn-primary w-100">Ver</button>
            </div>
        </div>
    </form>

    <!-- Resumo do dia -->
    <div class="d-flex flex-wrap gap-2 mb-3" th:unless="${agendaDoDia.vazia}">
        <span class="badge text-bg-light border" th:text="|${resumo.horarios} horários|"></span>
        <span class="badge text-bg-light border" th:text="|${resumo.livres} livres|"></span>
        <span class="badge text-bg-warning" th:text="|${resumo.aguardando} aguardando|"></span>
        <span class="badge text-bg-success" th:text="|${resumo.realizados} realizados|"></span>
        <span class="badge text-bg-secondary" th:text="|${resumo.faltas} faltas|"></span>
    </div>

    <div class="alert alert-light border" th:if="${agendaDoDia.vazia}">
        Nenhum horário cadastrado nesta data.
        <a th:href="@{/agenda/lote}" sec:authorize="hasRole('MEDICO')">Gerar horários</a>
    </div>

    <section class="card border-0 shadow-sm mb-3" th:each="grupo : ${agendaDoDia.grupos}">
        <div class="card-header bg-white">
            <h2 class="h6 mb-0">
                <span th:text="${grupo.medico.nome}">Médico</span>
                <span class="text-secondary fw-normal" th:text="|· ${grupo.medico.especialidade}|"></span>
            </h2>
        </div>
        <div class="table-responsive">
            <table class="table align-middle mb-0">
                <thead>
                <tr>
                    <th class="coluna-horario">Horário</th>
                    <th>Paciente</th>
                    <th>Situação</th>
                    <th sec:authorize="hasRole('ATENDENTE')">Ações</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="linha : ${grupo.linhas}" th:with="agenda=${linha.agenda}, agendamento=${linha.agendamento}">
                    <td class="fw-bold" th:text="${#temporals.format(agenda.horario, 'HH:mm')}"></td>

                    <!-- Horário livre -->
                    <th:block th:if="${linha.livre}">
                        <td class="text-secondary">—</td>
                        <td><span class="badge text-bg-light border">Livre</span></td>
                        <td sec:authorize="hasRole('ATENDENTE')">
                            <a class="btn btn-sm btn-outline-primary" th:if="${agenda.dataHora.isAfter(agora)}"
                               th:href="@{/agendamentos/novo/{id}(id=${agenda.id})}">Agendar</a>
                        </td>
                    </th:block>

                    <!-- Horário ocupado -->
                    <th:block th:unless="${linha.livre}"
                              th:with="descricao=|${agendamento.paciente.nome} com ${grupo.medico.nome}, em ${#temporals.format(agenda.data, 'dd/MM/yyyy')} às ${#temporals.format(agenda.horario, 'HH:mm')}|">
                        <td>
                            <div th:text="${agendamento.paciente.nome}"></div>
                            <div class="small text-secondary" th:text="${agendamento.paciente.telefone}"></div>
                        </td>
                        <td><div th:replace="~{fragments/agendamento :: situacao(${agendamento})}"></div></td>
                        <td sec:authorize="hasRole('ATENDENTE')"><div th:replace="~{fragments/agendamento :: acoes(${agendamento}, ${descricao})}"></div></td>
                    </th:block>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>

<th:block th:replace="~{fragments/agendamento :: modais('dia', ${agendaDoDia.data})}"></th:block>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>

</body>
</html>
