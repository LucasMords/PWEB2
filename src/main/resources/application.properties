spring.application.name=clinica

spring.datasource.url=jdbc:h2:mem:clinica;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# O esquema e recriado em cada inicializacao e o Hibernate executa import.sql.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.thymeleaf.cache=false

# Verificacao de saude (Actuator). So o health fica exposto pela web: /actuator/health,
# /actuator/health/liveness e /actuator/health/readiness. Os detalhes (banco, disco) so
# aparecem para ADMIN; os demais veem apenas {"status":"UP"}.
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when-authorized
management.endpoint.health.roles=ADMIN
