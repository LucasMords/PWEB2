spring.application.name=clinica

# PostgreSQL. O endereco, o usuario e a senha vem das variaveis de ambiente DB_URL,
# DB_USUARIO e DB_SENHA; a senha nunca fica no codigo.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/clinica}
spring.datasource.username=${DB_USUARIO:clinica}
spring.datasource.password=${DB_SENHA:}

# O esquema e criado e evoluido pelo Flyway (src/main/resources/db/migration). O Hibernate
# so confere, ao subir, se as entidades batem com as tabelas; nunca altera o banco.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# Em desenvolvimento, alem do esquema, entram os dados de demonstracao (db/demo):
# pacientes, medicos e agenda de exemplo. O perfil prod usa so db/migration.
spring.flyway.locations=classpath:db/migration,classpath:db/demo

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.thymeleaf.cache=false

# Contas da equipe criadas ao subir, se ainda nao existirem (InitialUsersInitializer).
# Senhas de desenvolvimento; em producao vem obrigatoriamente do ambiente.
clinica.usuarios-iniciais.senha-admin=${CLINICA_SENHA_ADMIN:Admin123}
clinica.usuarios-iniciais.senha-atendente=${CLINICA_SENHA_ATENDENTE:Atendente123}

# Verificacao de saude (Actuator). So o health fica exposto pela web: /actuator/health,
# /actuator/health/liveness e /actuator/health/readiness. Os detalhes (banco, disco) so
# aparecem para ADMIN; os demais veem apenas {"status":"UP"}.
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when-authorized
management.endpoint.health.roles=ADMIN
