# Perfil de producao (ativado com SPRING_PROFILES_ACTIVE=prod, como no Dockerfile).

# Banco: DB_URL, DB_USUARIO e DB_SENHA vem do ambiente. So as migracoes do esquema; os
# dados de demonstracao (db/demo) nunca entram em producao.
spring.flyway.locations=classpath:db/migration

# Contas iniciais: sem senha padrao. Sem CLINICA_SENHA_ADMIN a aplicacao nao sobe; sem
# CLINICA_SENHA_ATENDENTE a conta atendente nao e criada.
clinica.usuarios-iniciais.senha-admin=${CLINICA_SENHA_ADMIN}
clinica.usuarios-iniciais.senha-atendente=${CLINICA_SENHA_ATENDENTE:}

# Sem SQL no log (pode conter dados de pacientes).
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.thymeleaf.cache=true

# Logs em JSON (formato ECS), uma linha por evento, para ferramentas de coleta de logs.
logging.structured.format.console=ecs
logging.level.root=INFO

# HTTPS fica no proxy reverso (nginx, balanceador): os cabecalhos X-Forwarded-* informam
# o endereco e o protocolo originais, para os redirecionamentos e o HSTS usarem https.
server.forward-headers-strategy=native
server.servlet.session.cookie.secure=true

# Logs tambem em arquivo (JSON), com rotacao: um arquivo novo a cada 10 MB ou por dia,
# guardados por 14 dias e no maximo 500 MB no total. No Docker, a pasta logs/ e um volume.
logging.file.name=${LOG_ARQUIVO:logs/clinica.log}
logging.structured.format.file=ecs
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=14
logging.logback.rollingpolicy.total-size-cap=500MB
